name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"   # weekly, so a Home Assistant or HACS rule change shows up without a commit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands   # the icon goes to home-assistant/brands once the integration has entities
